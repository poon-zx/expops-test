metadata:
  name: "asymmetric-key"
  description: "RSA encryption/decryption benchmark (Boicea et al.–style): matrix — key sizes 1024/2048 bits × payload 2/3/4 bytes, OAEP-SHA256, 10 trials per cell; logs mean_encrypt_ms and mean_decrypt_ms. (This runtime enforces RSA key_size ≥ 1024.)"
  version: "1.0.0"

scripts:
  main: "src/asymmetric_key_model.py"
  reporting: "src/plot_metrics.py"
  reporting_js: "src/plot_metrics.js"

environment:
  asymmetric-key-env:
    venv: ["requirements.txt"]
  asymmetric-key-env-reporting:
    venv: ["requirements-charts.txt"]

reproducibility:
  random_seed: 42

experiment:
  cache:
    backend:
      type: gcp
      gcp_project: mlops-platform-470017
      credentials_json: "src/firestore.json"
    object_store:
      type: gcs
      bucket: mlops-platform123

  parameters:
    rsa_key_sizes_bits: [1024, 2048]
    payload_sizes_bytes: [2, 3, 4]
    num_trials_per_cell: 10

  pipeline:
    process_adjlist: |
      data_generation_p2 rsa_1024_p2
      data_generation_p2 rsa_2048_p2
      data_generation_p3 rsa_1024_p3
      data_generation_p3 rsa_2048_p3
      data_generation_p4 rsa_1024_p4
      data_generation_p4 rsa_2048_p4
      rsa_1024_p2 asymmetric_summary_chart
      rsa_2048_p2 asymmetric_summary_chart
      rsa_1024_p3 asymmetric_summary_chart
      rsa_2048_p3 asymmetric_summary_chart
      rsa_1024_p4 asymmetric_summary_chart
      rsa_2048_p4 asymmetric_summary_chart

    processes:
      - name: "data_generation_p2"
        code: "data_generation"
        parameters:
          payload_size_bytes: 2
          random_seed: 42

      - name: "data_generation_p3"
        code: "data_generation"
        parameters:
          payload_size_bytes: 3
          random_seed: 42

      - name: "data_generation_p4"
        code: "data_generation"
        parameters:
          payload_size_bytes: 4
          random_seed: 42

      - name: "rsa_1024_p2"
        code: "define_rsa_bench"
        parameters:
          key_size: 1024
          num_trials: 10

      - name: "rsa_2048_p2"
        code: "define_rsa_bench"
        parameters:
          key_size: 2048
          num_trials: 10

      - name: "rsa_1024_p3"
        code: "define_rsa_bench"
        parameters:
          key_size: 1024
          num_trials: 10

      - name: "rsa_2048_p3"
        code: "define_rsa_bench"
        parameters:
          key_size: 2048
          num_trials: 10

      - name: "rsa_1024_p4"
        code: "define_rsa_bench"
        parameters:
          key_size: 1024
          num_trials: 10

      - name: "rsa_2048_p4"
        code: "define_rsa_bench"
        parameters:
          key_size: 2048
          num_trials: 10

      - name: "asymmetric_summary_chart"
        code: "reporting.asymmetric_summary_chart"
        environment: "asymmetric-key-env-reporting"
        probe_paths:
          rsa_1024_p2: "//*[@name='rsa_1024_p2']/*[@name='run_trials']"
          rsa_2048_p2: "//*[@name='rsa_2048_p2']/*[@name='run_trials']"
          rsa_1024_p3: "//*[@name='rsa_1024_p3']/*[@name='run_trials']"
          rsa_2048_p3: "//*[@name='rsa_2048_p3']/*[@name='run_trials']"
          rsa_1024_p4: "//*[@name='rsa_1024_p4']/*[@name='run_trials']"
          rsa_2048_p4: "//*[@name='rsa_2048_p4']/*[@name='run_trials']"
